<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>Study Planner</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;padding:20px}.card{background:white;padding:20px;border-radius:16px;box-shadow:0 5px 20px rgba(0,0,0,.08)}button,input{padding:10px;margin:5px}ul{padding:0}li{list-style:none;margin:8px 0}</style></head><body><div class='card'><h1>📚 Student Study Planner</h1><p>Working starter version</p><input id='taskInput' placeholder='New Task'><button onclick='addTask()'>Add Task</button><ul id='tasks'></ul></div><script>let tasks=JSON.parse(localStorage.getItem('tasks')||'[]');function render(){tasksEl.innerHTML='';tasks.forEach((t,i)=>tasksEl.innerHTML+=`<li><input type=checkbox ${t.done?'checked':''} onchange='toggle(${i})'> ${t.text}</li>`);localStorage.setItem('tasks',JSON.stringify(tasks));}const tasksEl=document.getElementById('tasks');function addTask(){const v=document.getElementById('taskInput').value;if(v){tasks.push({text:v,done:false});render();}}function toggle(i){tasks[i].done=!tasks[i].done;render();}render();</script></body></html>
